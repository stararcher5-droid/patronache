<style>

  .carte button { font:inherit; font-size:12px; padding:6px 10px; border-radius:8px; border:0; background:#6a4b00; color:#fff; cursor:pointer; width:100%; }

    .actiuni { gap:8px; } .actiuni .btn { width:100%; text-align:center; } .actiuni .gol { width:100%; }
    .carti { gap:10px; } .carte { width:calc(50% - 5px); min-height:0; }
    .dezvaluire .carte { width:200px; }
    .mare { font-size:32px; }
    .tabel td:last-child { white-space:nowrap; padding-left:8px; }
    .clasament .rand { grid-template-columns:52px 1fr; } .clasament .rand span { grid-column:1 / -1; order:-1; font-size:13px; white-space:normal; }
    .modal { padding:10px; align-items:end; } .modal .card { max-height:85vh; width:100%; }
    footer { font-size:13px; gap:10px 16px; } footer a { padding:6px 0; }
  }
  @media (min-width:521px) and (max-width:900px) {
    .pagina { max-width:680px; }
  }
</style>
</head>
<body>
<div class="pagina">
  <div id="eroare" class="eroare ascuns"></div>
  <div id="ecran"></div>
  <footer>
    <a id="l-cum">Cum se joacă</a>
    <a id="l-renunta" class="ascuns">Închide firma și ia-o de la capăt</a>
    <span style="flex:1"></span>
    <span id="versiune"></span>
  </footer>
</div>
<div id="modal" class="modal ascuns"></div>

<script>
// ------------------------------------------------------------------ stare
const RES = [
  { k: 'parteneri', nume: 'Parteneri', icon: '🤝' },
  { k: 'bunastare', nume: 'Bunăstare', icon: '👷' },
  { k: 'legalitate', nume: 'Legalitate', icon: '⚖️' },
];
const SIGLE = ['🥨', '🔧', '🚚', '💡', '🏗️', '🍕', '💻', '✂️', '🐓', '🚜', '☕', '🧱', '🛒', '📦', '🎩', '🍺'];
const CULORI = ['#e0664a', '#e2b23a', '#4fb79b', '#5b8def', '#a06ad6', '#e8e1cf'];
let CONT = null;          // /api/continut
let joc = null;           // { id, firma }
let pas = null;           // pasul curent de la server
let ultimulEfect = null;  // efectul ultimei alegeri, cât e afișat
let pasUrmator = null;    // pasul primit de la server după alegere, afișat la „Mai departe”

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const semn = n => (n > 0 ? '+' : '') + n;

async function api(metoda, cale, corp) {
  const r = await fetch(cale, { method: metoda, headers: { 'Content-Type': 'application/json' }, body: corp ? JSON.stringify(corp) : undefined });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(typeof d.detail === 'string' ? d.detail : 'Eroare ' + r.status); e.status = r.status; throw e; }
  return d;
}
function eroare(msg) { const e = $('#eroare'); if (!msg) return e.classList.add('ascuns'); e.textContent = msg; e.classList.remove('ascuns'); }
function salveazaLocal() { try { joc ? localStorage.setItem('patronache-joc', JSON.stringify(joc)) : localStorage.removeItem('patronache-joc'); } catch (e) {} }
function citesteLocal() { try { return JSON.parse(localStorage.getItem('patronache-joc') || 'null'); } catch (e) { return null; } }

// ------------------------------------------------------------------ pornire
let modTest = null;   // id-ul mini-jocului testat din admin (/?minijoc=id), fără partidă
async function porneste() {
  try { CONT = await api('GET', '/api/continut'); } catch (e) { return eroare('Serverul nu răspunde: ' + e.message); }
  const idTest = new URLSearchParams(location.search).get('minijoc');
  if (idTest) return ecranTestMinijoc(idTest);
  const salvat = citesteLocal();
  if (salvat && salvat.id) {
    try { const d = await api('GET', '/api/partida/' + salvat.id); joc = salvat; pas = d.pas; return arata(); }
    catch (e) { localStorage.removeItem('patronache-joc'); }
  }
  ecranStart();
}

function ecranStart() {
  joc = null; pas = null; salveazaLocal();
  $('#l-renunta').classList.add('ascuns');
  $('.pagina').classList.add('larg');
  const el = $('#ecran');
  el.innerHTML = `
    <div class="card intra start">
      <div class="start-grid">
        <div class="start-stanga">
          <div class="cand">Registrul Comerțului · formular de înființare</div>
          <h1>Ești patron.<br>Ai ${CONT.ani} ani.</h1>
          <p class="text">Ține partenerii aproape, oamenii mulțumiți și ANAF-ul departe. Fiecare alegere mișcă relația cu partenerii, bunăstarea angajaților și legalitatea, și aduce sau pierde bani. Dacă una din cele trei ajunge la zero, s-a terminat.</p>
          <div class="camp"><label>Numele firmei</label><input type="text" id="f-nume" maxlength="40" placeholder="Patronache SRL"></div>
          <div class="camp"><label>Slogan (opțional)</label><input type="text" id="f-slogan" maxlength="80" placeholder="Ieftin, rapid, aproape legal"></div>
        </div>
        <div class="start-dreapta">
          <div class="camp"><label>Domeniul firmei</label>
            <div class="domenii" id="f-domenii">${(CONT.domenii || []).map((d, i) => `<button type="button" data-v="${esc(d.id)}" class="${i === 0 ? 'activ' : ''}"><span class="ic">${esc(d.icon || '🏢')}</span><span class="nm">${esc(d.nume)}</span></button>`).join('')}</div>
            <div class="gol domeniu-desc" id="f-domeniu-desc">${esc((CONT.domenii[0] || {}).desc || '')}</div>
          </div>
          <div class="camp"><label>Sigla</label><div class="alegeri sigle" id="f-sigle">${SIGLE.map((s, i) => `<button type="button" data-v="${s}" class="${i === 0 ? 'activ' : ''}">${s}</button>`).join('')}</div></div>
          <div class="camp"><label>Culoarea</label><div class="alegeri culori" id="f-culori">${CULORI.map((c, i) => `<button type="button" data-v="${c}" class="${i === 0 ? 'activ' : ''}" style="--c:${c}"><span class="culoare"></span></button>`).join('')}</div></div>
        </div>
        <div class="start-jos">
          <button class="btn tine mare-cta" id="f-start"><i></i><span>Ține apăsat: semnezi actele</span></button>
          ${CONT.situatii < CONT.ani * CONT.trimestre_pe_an * CONT.decizii_pe_trimestru ? '<p class="gol" style="margin-top:12px">Conținutul e încă în lucru: partida se poate termina înainte de ' + CONT.ani + ' ani dacă nu mai sunt situații.</p>' : ''}
        </div>
      </div>
    </div>`;
  for (const g of ['#f-sigle', '#f-culori', '#f-domenii']) $(g, el).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; $$(g + ' button').forEach(x => x.classList.remove('activ')); b.classList.add('activ'); if (g === '#f-domenii') $('#f-domeniu-desc').textContent = (CONT.domenii.find(d => d.id === b.dataset.v) || {}).desc || ''; });
  tineApasat($('#f-start', el), 600, incepePartida);
}
const $$ = (s, el = document) => [...el.querySelectorAll(s)];

function tineApasat(btn, ms, cb) {
  let t0 = null, raf = null, terminat = false;
  const bara = $('i', btn), eticheta = $('span', btn), textInitial = eticheta.textContent;
  const PASI = ['Semnezi…', 'Ștampila!'];
  const tick = () => {
    const p = Math.min(1, (performance.now() - t0) / ms);
    bara.style.width = p * 100 + '%';
    eticheta.textContent = PASI[Math.min(PASI.length - 1, Math.floor(p * PASI.length))];
    if (p >= 1) { gata(true); } else raf = requestAnimationFrame(tick);
  };
  const gata = (complet = false) => {
    cancelAnimationFrame(raf); t0 = null; btn.classList.remove('apasat');
    if (!complet) { bara.style.width = '0'; eticheta.textContent = textInitial; return; }
    terminat = true; btn.classList.add('gata'); if (navigator.vibrate) navigator.vibrate(40);
    const st = document.createElement('div'); st.className = 'stampila'; st.textContent = 'Înregistrat';
    btn.closest('.card').appendChild(st); requestAnimationFrame(() => st.classList.add('cade'));
    setTimeout(cb, 450);
  };
  btn.style.minWidth = btn.offsetWidth + 'px';   // textul se schimbă cât ții, butonul nu trebuie să-și schimbe lățimea
  btn.addEventListener('pointerdown', e => { if (terminat || t0) return; e.preventDefault(); try { btn.setPointerCapture(e.pointerId); } catch (_) {} btn.classList.add('apasat'); t0 = performance.now(); raf = requestAnimationFrame(tick); });
  btn.addEventListener('contextmenu', e => e.preventDefault());
  // doar ridicarea degetului sau anularea opresc; ieșirea de pe buton nu, că pointerul e capturat
  for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) btn.addEventListener(ev, () => { if (t0) gata(false); });
  btn.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && !terminat) { e.preventDefault(); gata(true); } });
}

async function incepePartida() {
  eroare(null);
  const firma = {
    nume: $('#f-nume').value.trim() || 'Patronache SRL',
    slogan: $('#f-slogan').value.trim(),
    sigla: $('.activ', $('#f-sigle')).dataset.v,
    culoare: $('.activ', $('#f-culori')).dataset.v,
    domeniu: ($('.activ', $('#f-domenii')) || {}).dataset?.v || '',
  };
  try {
    const d = await api('POST', '/api/partida', firma);
    joc = { id: d.id, firma }; pas = d.pas; ultimulEfect = null; pasUrmator = null; salveazaLocal(); arata();
  } catch (e) { eroare('Nu s-a putut deschide firma: ' + e.message); }
}

// ------------------------------------------------------------------ afișare
function arata() {
  eroare(null);
  $('.pagina').classList.remove('larg');
  document.documentElement.style.setProperty('--accent', joc.firma.culoare || '#c9472b');
  $('#l-renunta').classList.toggle('ascuns', !joc);
  const el = $('#ecran');
  let corp = '';
  if (pas.pas === 'decizie') corp = ecranDecizie();
  else if (pas.pas === 'bilant') corp = ecranBilant();
  else if (pas.pas === 'minijoc') corp = ecranMinijoc();
  else corp = ecranFinal();
  el.innerHTML = antet() + corp;
  leagaEvenimente();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function antet() {
  const f = joc.firma;
  const r = pas.resurse;
  return `
    <header class="top">
      <div class="sigla">${esc(f.sigla || '🏢')}</div>
      <div class="firma"><b>${esc(f.nume)}</b><small>${esc(numeDomeniu(f.domeniu))}${f.slogan ? ' · ' + esc(f.slogan) : ''}</small></div>
      <div class="nivel">nivelul ${pas.nivel.nivel}<b>${esc(pas.nivel.nume)}</b></div>
    </header>
    ${baraProfit()}
    ${scuturiHtml()}
    <div class="resurse">
      ${RES.map(x => `<div class="res ${x.k} ${r[x.k] <= 15 ? 'alarma' : ''}"><div class="et"><span>${x.icon} ${x.nume}</span><b>${r[x.k]}</b></div><div class="bara"><i style="width:${r[x.k]}%"></i></div></div>`).join('')}
    </div>`;
}

function baraProfit() {
  const niv = CONT.niveluri, curent = niv[pas.nivel.nivel - 1], urm = niv[pas.nivel.nivel];
  const total = pas.profit_total + (pas.profit_an || 0);
  let procent = 100, tinta = 'nivel maxim';
  if (urm) {
    procent = Math.max(0, Math.min(100, (total - curent.prag) / (urm.prag - curent.prag) * 100));
    tinta = `nivelul ${urm.nivel} la ${urm.prag} mii`;
  }
  return `<div class="profit"><div class="et"><span>📈 Profit total <b>${semn(total)} mii</b>${pas.profit_an ? ` <small>(${semn(pas.profit_an)} anul ăsta, se închide la bilanț)</small>` : ''}</span><span>${tinta}</span></div><div class="bara"><i style="width:${procent}%"></i></div></div>`;
}

function ecranDecizie() {
  const ef = ultimulEfect;
  const total = CONT.ani * CONT.trimestre_pe_an * CONT.decizii_pe_trimestru;
  return `
    <div class="card intra">
      <div class="cand">Anul ${pas.an} · trimestrul ${pas.trimestru} · decizia ${pas.nr_decizie} din ${total}${pas.profit_an ? ' · profit pe an: ' + semn(pas.profit_an) + ' mii' : ''}</div>
      <h1>${esc(pas.titlu)}</h1>
      <p class="text">${esc(pas.text)}</p>
      <div class="optiuni">
        ${pas.optiuni.map((o, i) => o.ascunsa ? '' : `<button class="opt ${ef && ef.ales === i ? 'aleasa' : ''} ${ef ? 'cu-procent' : ''}" data-i="${i}" ${o.blocat || ef ? 'disabled' : ''}>${esc(o.text)}${o.blocat ? `<span class="blocat">🔒 ${esc(o.blocat)}</span>` : o.deblocat ? `<span class="deblocat">🔓 ${esc(o.deblocat)}</span>` : ''}${ef ? `<span class="procent">${ef.procente[i]}%</span>` : ''}</button>`).join('')}
      </div>
      ${ef ? efecteHtml(ef) + `<div class="actiuni"><button class="btn" id="mai-departe">Mai departe</button><span class="gol">procentele: câți jucători au ales fiecare variantă</span></div>` : ''}
    </div>
    <div class="card inventar">
      <h3>Inventar · cărți speciale</h3>
      ${pas.carti.length ? `<div class="carti">${pas.carti.map(c => carteHtml(c, `<button data-carte="${esc(c.id)}" ${ef ? 'disabled' : ''}>${c.surpriza ? 'Întoarce-o' : 'Folosește acum'}</button>`)).join('')}</div>`
        : '<div class="gol">Nimic încă. Unele alegeri îți aduc cărți: petreceri, team building, lucruri care ridică moralul când ai nevoie.</div>'}
    </div>`;
}
function carteHtml(c, buton = '') {
  const icon = c.icon || '🃏';
  if (c.surpriza) {
    return `<div class="carte spate"><span class="colt ss">?</span><span class="colt dj">?</span><div class="mare">❔</div><b>Carte surpriză</b><div class="d">Poate fi bună, poate fi rea. Nu știi până n-o întorci.</div>${buton}</div>`;
  }
  return `<div class="carte"><span class="colt ss">${esc(icon)}</span><span class="colt dj">${esc(icon)}</span><div class="mare">${esc(icon)}</div><b>${esc(c.nume)}</b><div class="d">${esc(c.desc || '')}</div><div class="efecte">${efectCarte(c.efect)}</div>${buton}</div>`;
}
function dezvaluie(carte, efect) {
  const d = document.createElement('div'); d.className = 'dezvaluire';
  const chips = efecteHtml({ delta: efect.delta || {}, profit: efect.profit || 0, profit_baza: efect.profit_baza || 0, carte: null })
    + (efect.scut ? `<div class="efecte" style="justify-content:center"><span class="chip scut">🛡️ De la următoarea decizie: ${efect.scut.resurse.map(numeRes).join(', ')} nu poate scădea</span></div>` : '');
  d.innerHTML = `<div class="scena">${carteHtml({ ...carte, surpriza: false })}<div style="font-size:14px; margin-bottom:6px">${carte.surpriza ? 'Ai întors cartea.' : 'Ai folosit cartea.'}</div><div style="display:inline-block; text-align:left">${chips.replace('class="efecte"', 'class="efecte" style="margin:0; justify-content:center"')}</div><div><button class="btn">Mai departe</button></div></div>`;
  document.body.appendChild(d);
  const inchide = () => d.remove();
  $('.btn', d).addEventListener('click', inchide);
  d.addEventListener('click', e => { if (e.target === d) inchide(); });
}
function numeDomeniu(id) { const d = (CONT.domenii || []).find(x => x.id === id); return d ? (d.icon ? d.icon + ' ' : '') + d.nume : ''; }
function numeRes(k) { return (RES.find(x => x.k === k) || { nume: k }).nume; }
function efectCarte(ef) {
  if (!ef) return '';
  return RES.filter(x => ef[x.k]).map(x => `<span class="chip ${ef[x.k] > 0 ? 'plus' : 'minus'}">${x.nume} ${semn(ef[x.k])}</span>`).join('')
    + (ef.profit ? `<span class="chip ${ef.profit > 0 ? 'plus' : 'minus'}">Profit ${semn(ef.profit)}</span>` : '')
    + (ef.scut ? `<span class="chip scut">🛡️ ${ef.scut.resurse.map(numeRes).join(' și ')} nu scade la următoarea${(ef.scut.decizii || 1) > 1 ? 'le ' + ef.scut.decizii : ''} decizi${(ef.scut.decizii || 1) > 1 ? 'i' : 'e'}</span>` : '');
}
function scuturiHtml() {
  const sc = pas.scuturi || [];
  if (!sc.length) return '';
  return `<div class="scuturi">${sc.map(x => `<span class="chip scut">🛡️ ${esc(x.carte || 'Scut')}: ${x.resurse.map(numeRes).join(', ')} nu poate scădea ${x.activ_acum ? 'la decizia asta' : 'de la următoarea decizie'}${x.ramase > 1 ? ' (' + x.ramase + ' decizii)' : ''}</span>`).join('')}</div>`;
}
function efecteHtml(ef) {
  const chips = RES.filter(x => ef.delta[x.k]).map(x => `<span class="chip ${ef.delta[x.k] > 0 ? 'plus' : 'minus'}">${x.icon} ${x.nume} ${semn(ef.delta[x.k])}</span>`);
  if (ef.profit) chips.push(`<span class="chip ${ef.profit > 0 ? 'plus' : 'minus'}">Profit ${semn(ef.profit)} mii</span>`);
  if (ef.profit_baza) chips.push(`<span class="chip ${ef.profit_baza > 0 ? 'plus' : 'minus'}">📈 Activitatea firmei: ${semn(ef.profit_baza)} mii pe an, de acum până la final (acum ${semn(ef.profit_baza_total ?? 0)} pe an)</span>`);
  if (ef.carte) chips.push(`<span class="chip primita">🃏 ${ef.carte.surpriza ? 'Ai primit o carte surpriză' : 'Ai primit: ' + esc(ef.carte.nume)}</span>`);
  if (ef.carte_luata) chips.push(`<span class="chip minus">🃏 Ai pierdut: ${esc(ef.carte_luata.nume)}</span>`);
  for (const [k, v] of Object.entries(ef.scut_oprit || {})) chips.push(`<span class="chip scut">🛡️ Scutul a oprit: ${numeRes(k)} ${semn(v)}</span>`);
  if (!chips.length) chips.push('<span class="chip">Nimic nu s-a schimbat. Deocamdată.</span>');
  return `<div class="efecte">${chips.join('')}</div>`;
}

function ecranBilant() {
  const baza = pas.profit_baza || 0, alegeri = pas.profit_an || 0, an = alegeri + baza, total = pas.profit_total + an;
  const uz = CONT.uzura_pe_an || {};
  const uzuraTxt = Object.entries(uz).filter(([, v]) => v).map(([k, v]) => numeRes(k) + ' ' + semn(v)).join(', ');
  const niv = CONT.niveluri, curent = niv[pas.nivel.nivel - 1], urm = niv[pas.nivel.nivel];
  let nivelTxt;
  if (urm && total >= urm.prag) nivelTxt = `Cu totalul ăsta urci la nivelul ${urm.nivel}, ${esc(urm.nume)}.`;
  else if (curent && total < curent.prag) nivelTxt = `Cu totalul ăsta cobori de la nivelul ${curent.nivel}.`;
  else if (urm) nivelTxt = `Rămâi la nivelul ${curent.nivel}; pentru ${urm.nivel} îți trebuie ${urm.prag} mii în total.`;
  else nivelTxt = 'Ești la nivelul maxim.';
  return `
    <div class="card intra">
      <div class="cand">Sfârșitul anului ${pas.an}</div>
      <h1>Bilanțul</h1>
      <p class="text">Contabilul pune hârtiile pe masă. Așa arată anul:</p>
      <table class="tabel">
        <tr><td>Efectul alegerilor tale</td><td style="color:${alegeri > 0 ? 'var(--ok)' : alegeri < 0 ? 'var(--rau)' : 'inherit'}">${alegeri ? semn(alegeri) : '0'} mii</td></tr>
        ${baza ? `<tr><td>Activitatea curentă a firmei</td><td>${semn(baza)} mii</td></tr>` : ''}
        <tr><td><b>Profitul anului</b></td><td style="color:${an >= 0 ? 'var(--ok)' : 'var(--rau)'}"><b>${an ? semn(an) : '0'} mii</b></td></tr>
        <tr><td>Profit total după acest an</td><td>${semn(total)} mii</td></tr>
        ${uzuraTxt ? `<tr><td>Uzura anului <span class="gol">(partenerii uită, oamenii se plictisesc, hârtiile se învechesc)</span></td><td>${uzuraTxt}</td></tr>` : ''}
      </table>
      <p class="gol">${nivelTxt}</p>
      <div class="actiuni"><button class="btn" id="inchide-anul">Închide anul</button></div>
    </div>`;
}

function ecranBilantRezultat(b) {
  const nivelNou = CONT.niveluri[b.nivel - 1];
  const urcat = b.nivel > b.nivel_vechi, coborat = b.nivel < b.nivel_vechi;
  const dir = urcat ? 'Firma a crescut' : coborat ? 'Firma a scăzut' : `Rămâi la nivelul ${b.nivel}`;
  const urm = CONT.niveluri[b.nivel];
  const urmator = urm ? `Pentru nivelul ${b.nivel + 1} (${esc(urm.nume)}) îți trebuie ${urm.prag} mii lei profit total; mai ai de făcut ${Math.max(0, urm.prag - b.profit_total)} mii.` : 'Ești la nivelul maxim.';
  const plachete = urcat || coborat
    ? `<div class="n">${b.nivel_vechi}</div><span>→</span><div class="n nou">${b.nivel}</div>`
    : `<div class="n nou">${b.nivel}</div>`;
  return antet() + `
    <div class="card intra">
      <div class="cand">Anul ${b.an} s-a încheiat</div>
      <h1>${dir}</h1>
      <div class="nivel-salt">${plachete}<div><b>${esc(nivelNou.nume)}</b><br><span class="gol">${esc(nivelNou.desc || '')}</span></div></div>

// 10. Dublează profitul: grilă 4×4 cu bancnote; tragi într-o direcție, bancnotele egale se unesc și se dublează. 25 de mutări.
function mjDubleaza(arena, gata) {
  const N = 4, MUTARI = 25; let grila = Array.from({ length: N }, () => Array(N).fill(0)), mutari = 0, activ = true;
  const SCOR = { 10: 0, 20: 10, 40: 25, 80: 40, 160: 60, 320: 80, 640: 95, 1280: 100 };
  arena.innerHTML = `<div class="mj-sus">Mutări rămase: <b id="mj-mut">${MUTARI}</b> · cea mai mare bancnotă: <b id="mj-max">10</b> lei</div><div class="mj-grila" id="mj-grila"></div>
    <div class="mj-sageti"><button data-d="sus">▲</button><div><button data-d="stanga">◀</button><button data-d="jos">▼</button><button data-d="dreapta">▶</button></div></div>
    <p class="gol" style="text-align:center">Trage cu degetul pe grilă, apasă săgețile sau folosește tastele. Două bancnote egale se unesc.</p>`;
  const el = $('#mj-grila');
  const culoare = v => ({ 10: '#8a7a55', 20: '#9c8a2e', 40: '#b0953a', 80: '#c49a2b', 160: '#d9a62b', 320: '#e2b23a', 640: '#f0c24f', 1280: '#ffd166' }[v] || '#ffe08a');
  const deseneaza = () => { el.innerHTML = grila.flat().map(v => `<div class="mj-celula" style="${v ? 'background:' + culoare(v) + '; color:#1a1c22' : ''}">${v ? v : ''}</div>`).join(''); $('#mj-max').textContent = Math.max(10, ...grila.flat()); $('#mj-mut').textContent = MUTARI - mutari; };
  const libere = () => { const l = []; grila.forEach((r, i) => r.forEach((v, j) => { if (!v) l.push([i, j]); })); return l; };
  const adauga = () => { const l = libere(); if (!l.length) return; const [i, j] = l[Math.floor(Math.random() * l.length)]; grila[i][j] = Math.random() < 0.85 ? 10 : 20; };
  const strange = linie => { const a = linie.filter(Boolean); const b = []; for (let i = 0; i < a.length; i++) { if (a[i] === a[i + 1]) { b.push(a[i] * 2); i++; } else b.push(a[i]); } while (b.length < N) b.push(0); return b; };
  const muta = d => {
    if (!activ) return;
    const vechi = JSON.stringify(grila); let g = grila.map(r => r.slice());
    const rot = m => m[0].map((_, j) => m.map(r => r[j]));          // transpune
    if (d === 'stanga') g = g.map(strange);
    if (d === 'dreapta') g = g.map(r => strange(r.slice().reverse()).reverse());
    if (d === 'sus') g = rot(rot(g).map(strange));
    if (d === 'jos') g = rot(rot(g).map(r => strange(r.slice().reverse()).reverse()));
    if (JSON.stringify(g) === vechi) return;                          // mutare fără efect nu se numără
    grila = g; mutari++; adauga(); deseneaza();
    const poate = libere().length > 0 || grila.some((r, i) => r.some((v, j) => (j < N - 1 && v === r[j + 1]) || (i < N - 1 && v === grila[i + 1][j])));
    if (mutari >= MUTARI || !poate) { activ = false; document.removeEventListener('keydown', tasta); const max = Math.max(...grila.flat()); gata(SCOR[max] ?? 100); }
  };
  const tasta = e => { const d = { ArrowLeft: 'stanga', ArrowRight: 'dreapta', ArrowUp: 'sus', ArrowDown: 'jos' }[e.key]; if (d) { e.preventDefault(); muta(d); } };
  document.addEventListener('keydown', tasta);
  $$('.mj-sageti button', arena).forEach(b => b.addEventListener('click', () => muta(b.dataset.d)));
  let p0 = null;
  el.addEventListener('pointerdown', e => { p0 = [e.clientX, e.clientY]; });
  el.addEventListener('pointerup', e => { if (!p0) return; const dx = e.clientX - p0[0], dy = e.clientY - p0[1]; p0 = null; if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return; muta(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'dreapta' : 'stanga') : (dy > 0 ? 'jos' : 'sus')); });
  adauga(); adauga(); deseneaza();
}

// 11. Ascunde actele: tragi un act peste altul de același fel și se unesc: hârtie → teanc → dosar → cutie → dulap → arhivă.
function mjAscunde(arena, gata) {
  const NIV = [['📄', 'hârtie'], ['📑', 'teanc'], ['📁', 'dosar'], ['📦', 'cutie'], ['🗄️', 'dulap'], ['🏛️', 'arhivă']];
  const SCOR = [0, 20, 45, 70, 90, 100];
  const COL = 5, RND = 4, N = COL * RND; let celule = Array(N).fill(-1), timp = 45, activ = true, maxNiv = 0;
  arena.innerHTML = `<div class="mj-sus"><span id="mj-timp">${timp}</span>s · cel mai mare: <b id="mj-max">hârtie</b> · ANAF-ul vine când tabla e plină</div><div class="mj-tabla" id="mj-tabla"></div><p class="gol" style="text-align:center">Trage un act peste altul la fel ca să le unești. Actele noi vin singure.</p>`;
  const tabla = $('#mj-tabla');
  const deseneaza = () => { tabla.innerHTML = celule.map((n, i) => `<div class="mj-loc" data-i="${i}">${n >= 0 ? `<div class="mj-act" data-i="${i}" title="${NIV[n][1]}">${NIV[n][0]}</div>` : ''}</div>`).join(''); $('#mj-max').textContent = NIV[maxNiv][1]; leaga(); };
  const libere = () => celule.map((n, i) => n < 0 ? i : -1).filter(i => i >= 0);
  const poateUni = () => { const c = {}; celule.forEach(n => { if (n >= 0) c[n] = (c[n] || 0) + 1; }); return Object.values(c).some(x => x >= 2); };
  const termina = () => { if (!activ) return; activ = false; clearInterval(tTimp); clearInterval(tSpawn); gata(SCOR[maxNiv]); };
  const spawn = () => { if (!activ || !document.contains(tabla)) return; const l = libere(); if (!l.length) { if (!poateUni()) termina(); return; } celule[l[Math.floor(Math.random() * l.length)]] = Math.random() < 0.2 ? 1 : 0; deseneaza(); };
  // tragere cu pointer: funcționează și cu degetul
  let tras = null, fantoma = null;
  const leaga = () => {
    $$('.mj-act', tabla).forEach(a => a.addEventListener('pointerdown', e => {
      e.preventDefault(); tras = +a.dataset.i; a.classList.add('tras');
      fantoma = document.createElement('div'); fantoma.className = 'mj-fantoma'; fantoma.textContent = a.textContent; document.body.appendChild(fantoma); mutaFantoma(e);
    }));
  };
  const mutaFantoma = e => { if (fantoma) { fantoma.style.left = e.clientX + 'px'; fantoma.style.top = e.clientY + 'px'; } };
  document.addEventListener('pointermove', mutaFantoma);
  document.addEventListener('pointerup', e => {
    if (tras === null) return;
    const loc = document.elementFromPoint(e.clientX, e.clientY)?.closest('.mj-loc');
    const de = tras; tras = null; fantoma?.remove(); fantoma = null;
    if (!activ || !loc) { deseneaza(); return; }
    const la = +loc.dataset.i;
    if (la !== de) {
      if (celule[la] < 0) { celule[la] = celule[de]; celule[de] = -1; }
      else if (celule[la] === celule[de] && celule[la] < NIV.length - 1) { celule[la]++; celule[de] = -1; maxNiv = Math.max(maxNiv, celule[la]); if (maxNiv === NIV.length - 1) { deseneaza(); termina(); return; } }
    }
    deseneaza();
  });
  const tTimp = setInterval(() => { if (!document.contains(tabla)) { clearInterval(tTimp); clearInterval(tSpawn); activ = false; return; } timp--; $('#mj-timp').textContent = timp; if (timp <= 0) termina(); }, 1000);
  const tSpawn = setInterval(spawn, 1500);
  for (let k = 0; k < 5; k++) spawn();
  deseneaza();
}

function ecranFinal() {
  const f = pas.final;
  return `
    <div class="card intra">
      <div class="cand">${f.mandat_complet ? 'Mandat dus la capăt' : 'S-a terminat'}</div>
      <h1>${esc(f.titlu)}</h1>
      <p class="text">${esc(f.text)}</p>
      <div class="actiuni"><button class="btn" id="vezi-rezultat">Vezi rezultatul</button></div>
    </div>`;
}

async function arataRezultat() {
  let r;
  try { r = await api('GET', '/api/partida/' + joc.id + '/rezultat'); } catch (e) { return eroare(e.message); }
  const p = r.potrivire, c = p.castigator;
  const el = $('#ecran');
  el.innerHTML = antet() + `
    <div class="card intra">
      <div class="cand">${esc(joc.firma.nume)} · ${r.decizii} decizii · ${r.final.mandat_complet ? CONT.ani + ' ani' : 'oprit în anul ' + r.ani_jucati}</div>
      <h1>Nivelul ${r.nivel.nivel}: ${esc(r.nivel.nume)}</h1>
      <p class="text">${esc(r.nivel.desc || '')}</p>
      <table class="tabel">
        <tr><td>Profit total</td><td>${semn(r.profit_total)} mii lei</td></tr>
        <tr><td>Cum s-a terminat</td><td>${esc(r.final.titlu)}</td></tr>
        <tr><td>Cărți rămase în inventar</td><td>${r.carti.length ? r.carti.map(x => esc(x.nume)).join(', ') : 'niciuna'}</td></tr>
      </table>
    </div>
    ${c ? `<div class="card intra">
      <div class="cand">Ce fel de patron ai fost</div>
      <h2>${esc(c.nume)} <span class="gol">· ${c.procent}% potrivire</span></h2>
      <p class="text">${esc(c.desc || '')}</p>
      ${c.teme_la_fel && c.teme_la_fel.length ? `<div class="efecte" style="margin:0 0 10px">${c.teme_la_fel.map(t => `<span class="chip plus">${esc((CONT.teme[t] || {}).nume || t)}</span>`).join('')}</div><p class="gol" style="margin-top:-4px">temele pe care ați decis la fel</p>` : ''}
      ${p.busola && Object.keys(p.busola).length ? `<p class="busola">${Object.values(p.busola).map(a => esc(a.nume) + ': ' + esc(a.eticheta)).join(' · ')}</p>` : ''}
      <div class="clasament">${p.clasament.slice(0, 5).map(x => `<div class="rand"><b>${x.procent}%</b><div class="b"><i style="width:${x.procent}%"></i></div><span>${esc(x.nume)}</span></div>`).join('')}</div>
    </div>` : ''}
    <div class="actiuni">
      <button class="btn" id="din-nou">Deschide altă firmă</button>
      <button class="btn secundar" id="copiaza">Copiază rezultatul</button>
    </div>`;
  $('#din-nou').addEventListener('click', ecranStart);
  $('#copiaza').addEventListener('click', () => {
    const text = `Am fost patron ${CONT.ani} ani la ${joc.firma.nume}: nivelul ${r.nivel.nivel}, ${r.nivel.nume}, profit ${r.profit_total} mii lei. ${r.final.titlu}.${c ? ' Semăn cu: ' + c.nume + ' (' + c.procent + '%).' : ''} ${location.origin}`;
    navigator.clipboard?.writeText(text).then(() => { $('#copiaza').textContent = 'Copiat!'; }).catch(() => { prompt('Copiază:', text); });
  });
  joc = null; salveazaLocal(); $('#l-renunta').classList.add('ascuns');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ------------------------------------------------------------------ acțiuni
function leagaEvenimente() {
  $$('.opt').forEach(b => b.addEventListener('click', () => alege(+b.dataset.i)));
  $$('[data-carte]').forEach(b => b.addEventListener('click', () => folosesteCarte(b.dataset.carte)));
  $('#mai-departe')?.addEventListener('click', () => { if (pasUrmator) pas = pasUrmator; pasUrmator = null; ultimulEfect = null; arata(); });
  $('#inchide-anul')?.addEventListener('click', bilant);
  $('#mj-start')?.addEventListener('click', () => porneste_minijoc(pas.minijoc.id));
  $('#mj-sari')?.addEventListener('click', () => trimiteScor(null));
  $('#vezi-rezultat')?.addEventListener('click', arataRezultat);
}
let ocupat = false;
async function alege(i) {
  if (ocupat) return; ocupat = true;
  try {
    const d = await api('POST', '/api/partida/' + joc.id + '/alege', { optiune: i });
    ultimulEfect = { ...d.efect, ales: i };
    pasUrmator = d.pas;
    pas = { ...pas, resurse: d.efect.resurse, carti: d.pas.carti, nivel: d.pas.nivel, profit_an: pas.profit_an + (d.efect.profit || 0) };
    arata();
  } catch (e) { eroare(e.message); if (e.status === 409 || e.status === 404) { await reincarca(); } }
  ocupat = false;
}
async function folosesteCarte(id) {
  if (ocupat) return; ocupat = true;
  try {
    const d = await api('POST', '/api/partida/' + joc.id + '/carte', { carte: id });
    pas = d.pas; arata();
    dezvaluie(d.efect.carte, d.efect);
  } catch (e) { eroare(e.message); }
  ocupat = false;
}
async function bilant() {
  if (ocupat) return; ocupat = true;
  try {
    const d = await api('POST', '/api/partida/' + joc.id + '/bilant');
    pas = d.pas; ultimulEfect = null; pasUrmator = null;
    $('#ecran').innerHTML = ecranBilantRezultat(d.bilant);
    $('#mai-departe').addEventListener('click', () => arata());
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) { eroare(e.message); }
  ocupat = false;
}
async function reincarca() {
  try { const d = await api('GET', '/api/partida/' + joc.id); pas = d.pas; ultimulEfect = null; pasUrmator = null; arata(); }
  catch (e) { ecranStart(); }
}

// ------------------------------------------------------------------ meniu
$('#l-cum').addEventListener('click', () => {
  const m = $('#modal');
  m.innerHTML = `<div class="card"><h2>Cum se joacă</h2>
    <p>Ești patronul unei firme, ${CONT.ani} ani. În fiecare trimestru iei ${CONT.decizii_pe_trimestru} decizii: despre angajați, clienți, bani, ANAF, Primărie.</p>
    <p><b>Trei lucruri de urmărit</b>: partenerii (furnizori, clienți, bănci), bunăstarea angajaților și legalitatea. Fiecare e între 0 și 100. Dacă una ajunge la zero, s-a terminat: partenerii te lasă, toți pleacă sau vine DNA-ul.</p><p><b>Nimic nu stă pe loc</b>: la fiecare bilanț anual cele trei bare scad puțin de la sine. Le ții sus prin ce alegi.</p><p><b>La final de trimestru</b> vine un mini-joc scurt, ales la întâmplare: ștampilezi dosare, prinzi telefoane, tai pizza, negociezi un preț sau ghicești cât costă ceva ce cumpără firma ta. Scorul bun ridică o bară; scorul slab o scade puțin.</p><p><b>Banii</b> nu sunt o bară: fiecare alegere aduce sau pierde profit, iar profitul total dă nivelul firmei.</p>
    <p><b>Profit și nivel</b>: fiecare alegere aduce (sau pierde) bani. La finalul anului, profitul se adună la totalul firmei, iar totalul dă nivelul, de la 1 (firmă de apartament) la ${CONT.niveluri.length} (${esc(CONT.niveluri[CONT.niveluri.length - 1].nume)}). Nivelul deblochează alegeri noi, dar poate și să scadă după un an prost.</p>
    <p><b>Cărțile</b>: unele alegeri îți aduc cărți speciale în inventar. Le folosești când vrei, în timpul unei decizii; se consumă pe loc.</p>
    <p><b>Alegerile se leagă</b>: ce faci azi poate aduce o situație nouă mâine. Nepotul angajat azi greșește comanda mâine.</p>
    <p class="gol">Nu salvăm nimic despre tine: doar partida, sub un cod aleator, și numărăm anonim ce alege lumea.</p>
    <div class="actiuni"><button class="btn" id="inchide-modal">Am înțeles</button></div></div>`;
  m.classList.remove('ascuns');
  $('#inchide-modal').addEventListener('click', () => m.classList.add('ascuns'));
  m.addEventListener('click', e => { if (e.target === m) m.classList.add('ascuns'); });
});
$('#l-renunta').addEventListener('click', async () => {
  if (!joc || !confirm('Închizi firma? Partida curentă se pierde.')) return;
  try { await api('DELETE', '/api/partida/' + joc.id); } catch (e) {}
  ecranStart();
});

porneste();
</script>
